server:
  # この PC（127.0.0.1）からだけつなげる。AWS に置くときは、Nginx が窓口になる（localhost:8080 へ渡す）ので、このままでよい
  address: 127.0.0.1
spring:
  application:
    name: raisetimeline
  config:
    # リポジトリ直下の .env から、DBの接続情報を読み込む（backend/ から見て1つ上）
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:raisetimeline}
    username: ${POSTGRES_USER:raisetimeline}
    password: ${POSTGRES_PASSWORD}
  flyway:
    # テーブルは、Flyway が、db/migration の SQL（V1、V2…）を順に流して作る
    locations: classpath:db/migration
mybatis:
  # SQL は、Java ではなく、この場所の XML に書く（Mapper の名前と同じ名前の XML）
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # DB の列名（created_at）を、Java の項目名（createdAt）に自動で結びつける
    map-underscore-to-camel-case: true
app:
  jwt:
    # 署名の鍵。.env の JWT_SECRET から読む（リポジトリには入れない）。32 文字以上
    secret: ${JWT_SECRET}
    # アクセストークンは 15 分、リフレッシュトークンは 7 日
    access-expiration-ms: 900000
    refresh-expiration-days: 7
  cors:
    # 画面の URL だけを許可する
    allowed-origin: http://localhost:5173
management:
  endpoints:
    web:
      exposure:
        # 動作確認の /actuator/health だけを公開する。設定の値や部品の一覧が見える窓口は、開けない
        include: health
